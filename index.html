<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strategic Match - Job Search Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            background: white;
            padding: 20px 30px;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            margin-bottom: 25px;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 32px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .search-box {
            position: relative;
            width: 350px;
        }

        .search-box input {
            width: 100%;
            padding: 12px 40px 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 25px;
            font-size: 14px;
            transition: all 0.3s;
        }

        .search-box input:focus {
            outline: none;
            border-color: #667eea;
        }

        .search-icon {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #999;
        }

        .filters {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
            padding: 15px 0;
            border-top: 1px solid #f0f0f0;
        }

        .filter-btn {
            padding: 10px 20px;
            border: 2px solid #e0e0e0;
            background: white;
            border-radius: 25px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .filter-btn:hover {
            border-color: #667eea;
            color: #667eea;
            transform: translateY(-2px);
        }

        .filter-btn.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-color: transparent;
        }

        .tier-filter.tier1.active {
            background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
        }

        .tier-filter.tier2.active {
            background: linear-gradient(135deg, #C0C0C0 0%, #808080 100%);
        }

        .tier-filter.tier3.active {
            background: linear-gradient(135deg, #CD7F32 0%, #8B4513 100%);
        }

        .date-filter {
            margin-left: auto;
            position: relative;
        }

        .date-filter select {
            padding: 10px 35px 10px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 25px;
            background: white;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            appearance: none;
            transition: all 0.3s;
        }

        .date-filter select:hover {
            border-color: #667eea;
        }

        .date-filter::after {
            content: '▼';
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            pointer-events: none;
            font-size: 10px;
            color: #999;
        }

        .job-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(400px, 1fr));
            gap: 20px;
        }

        .job-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }

        .job-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        }

        /* Tier-specific card styling */
        .job-card.tier-1 {
            border: 3px solid #FFD700;
            background: linear-gradient(135deg, #FFFACD 0%, #FFFFFF 100%);
        }

        .job-card.tier-2 {
            border: 3px solid #C0C0C0;
        }

        .job-card.tier-3 {
            border: 2px solid #e0e0e0;
            padding: 15px;
        }

        .tier-badge {
            position: absolute;
            top: 15px;
            right: 15px;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .tier-badge.tier-1 {
            background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
            color: #000;
        }

        .tier-badge.tier-2 {
            background: linear-gradient(135deg, #C0C0C0 0%, #808080 100%);
            color: #000;
        }

        .tier-badge.tier-3 {
            background: linear-gradient(135deg, #CD7F32 0%, #8B4513 100%);
            color: #fff;
        }

        .job-header {
            margin-bottom: 15px;
            padding-right: 80px;
        }

        .job-title {
            font-size: 20px;
            font-weight: 700;
            color: #2d3748;
            margin-bottom: 8px;
            line-height: 1.3;
        }

        .job-company {
            font-size: 16px;
            color: #667eea;
            font-weight: 600;
        }

        .job-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin: 15px 0;
            padding: 15px 0;
            border-top: 1px solid #f0f0f0;
            border-bottom: 1px solid #f0f0f0;
        }

        .meta-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            color: #4a5568;
        }

        .badge {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            display: inline-block;
        }

        .badge-corporate {
            background: #e6f3ff;
            color: #0066cc;
        }

        .badge-nonprofit {
            background: #e6f7ed;
            color: #00875a;
        }

        .badge-score {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        /* Tier 3 simplified layout */
        .job-card.tier-3 .job-title {
            font-size: 16px;
        }

        .job-card.tier-3 .job-meta {
            margin: 10px 0;
            padding: 10px 0;
        }

        .quick-links {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin: 15px 0;
        }

        .quick-link {
            padding: 8px 15px;
            background: #f7fafc;
            border: 1px solid #e0e0e0;
            border-radius: 20px;
            font-size: 12px;
            color: #4a5568;
            text-decoration: none;
            transition: all 0.3s;
        }

        .quick-link:hover {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: white;
            color: #667eea;
            border: 2px solid #667eea;
        }

        .btn-secondary:hover {
            background: #667eea;
            color: white;
        }

        .btn-success {
            background: #00875a;
            color: white;
        }

        .btn-success:hover {
            background: #006644;
        }

        .expandable {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 2px solid #f0f0f0;
        }

        .expand-section {
            margin-bottom: 15px;
        }

        .section-title {
            font-size: 14px;
            font-weight: 700;
            color: #2d3748;
            margin-bottom: 8px;
        }

        .section-content {
            font-size: 13px;
            line-height: 1.6;
            color: #4a5568;
        }

        .hidden {
            display: none;
        }

        @media (max-width: 768px) {
            .job-grid {
                grid-template-columns: 1fr;
            }

            .filters {
                justify-content: center;
            }

            .date-filter {
                margin-left: 0;
                width: 100%;
            }

            .date-filter select {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="header-top">
                <h1>🎯 Strategic Match</h1>
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="Search jobs...">
                    <span class="search-icon">🔍</span>
                </div>
            </div>

            <div class="filters">
                <button class="filter-btn active" data-filter="all">
                    📊 Total Jobs (<span id="count-all">0</span>)
                </button>
                <button class="filter-btn" data-filter="high-match">
                    ⭐ High Match 90+ (<span id="count-high">0</span>)
                </button>
                <button class="filter-btn" data-filter="corporate">
                    🏢 Corporate (<span id="count-corporate">0</span>)
                </button>
                <button class="filter-btn" data-filter="nonprofit">
                    💚 Nonprofit (<span id="count-nonprofit">0</span>)
                </button>
                <button class="filter-btn tier-filter tier1" data-filter="tier1">
                    🥇 Tier 1 (<span id="count-tier1">0</span>)
                </button>
                <button class="filter-btn tier-filter tier2" data-filter="tier2">
                    🥈 Tier 2 (<span id="count-tier2">0</span>)
                </button>
                <button class="filter-btn tier-filter tier3" data-filter="tier3">
                    🥉 Tier 3 (<span id="count-tier3">0</span>)
                </button>
                <div class="date-filter">
                    <select id="dateFilter">
                        <option value="all">All Time</option>
                        <option value="today" selected>Today</option>
                        <option value="yesterday">Yesterday</option>
                        <option value="3days">Last 3 Days</option>
                        <option value="week">Last 7 Days</option>
                        <option value="2weeks">Last 14 Days</option>
                        <option value="month">Last 30 Days</option>
                    </select>
                </div>
            </div>
        </header>

        <div class="job-grid" id="jobGrid">
            <!-- Jobs will be inserted here -->
        </div>
    </div>

    <script>
        // Sample job data - will be replaced with actual database data
        const jobs = JSON.parse('{{JOBS_JSON}}');

        let currentFilter = 'all';
        let currentDateFilter = 'today';

        function formatDate(dateStr) {
            if (!dateStr) return 'Unknown';
            const date = new Date(dateStr);
            return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
        }

        function getDaysAgo(dateStr) {
            if (!dateStr) return 999;
            const date = new Date(dateStr);
            const today = new Date();
            const diffTime = Math.abs(today - date);
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
            return diffDays;
        }

        function filterByDate(job) {
            const daysAgo = getDaysAgo(job.date_added);

            switch(currentDateFilter) {
                case 'today': return daysAgo === 0;
                case 'yesterday': return daysAgo === 1;
                case '3days': return daysAgo <= 3;
                case 'week': return daysAgo <= 7;
                case '2weeks': return daysAgo <= 14;
                case 'month': return daysAgo <= 30;
                case 'all': return true;
                default: return true;
            }
        }

        function renderJobs() {
            const grid = document.getElementById('jobGrid');
            grid.innerHTML = '';

            let filteredJobs = jobs.filter(job => {
                // Date filter
                if (!filterByDate(job)) return false;

                // Type filter
                if (currentFilter === 'corporate' && job.job_type !== 'Corporate') return false;
                if (currentFilter === 'nonprofit' && job.job_type !== 'Nonprofit') return false;
                if (currentFilter === 'high-match' && parseInt(job.match_score) < 90) return false;
                if (currentFilter === 'tier1' && job.tier !== 1) return false;
                if (currentFilter === 'tier2' && job.tier !== 2) return false;
                if (currentFilter === 'tier3' && job.tier !== 3) return false;

                // Search filter
                const searchTerm = document.getElementById('searchInput').value.toLowerCase();
                if (searchTerm) {
                    return job.title.toLowerCase().includes(searchTerm) ||
                           job.company.toLowerCase().includes(searchTerm);
                }

                return true;
            });

            filteredJobs.forEach(job => {
                const card = createJobCard(job);
                grid.appendChild(card);
            });

            updateCounts();
        }

        function createJobCard(job) {
            const card = document.createElement('div');
            card.className = `job-card tier-${job.tier}`;
            card.dataset.id = job.id;

            const tier = job.tier || 3;
            const tierLabel = tier === 1 ? '🥇 Tier 1' : tier === 2 ? '🥈 Tier 2' : '🥉 Tier 3';

            let cardHTML = `
                <div class="tier-badge tier-${tier}">${tierLabel}</div>
                <div class="job-header">
                    <div class="job-title">${job.title}</div>
                    <div class="job-company">${job.company}</div>
                </div>

                <div class="job-meta">
                    <span class="badge badge-${job.job_type.toLowerCase()}">${job.job_type}</span>
                    ${job.match_score ? `<span class="badge badge-score">Match: ${job.match_score}%</span>` : ''}
            `;

            // Only show additional meta for Tier 1 & 2
            if (tier <= 2) {
                if (job.salary_range) {
                    cardHTML += `<div class="meta-item">💰 ${job.salary_range}</div>`;
                }
                if (job.location) {
                    cardHTML += `<div class="meta-item">📍 ${job.location}</div>`;
                }
                cardHTML += `<div class="meta-item">📅 ${formatDate(job.date_added)}</div>`;
            }

            cardHTML += `</div>`;

            // Quick links (only for Tier 1 & 2)
            if (tier <= 2 && job.company_overview) {
                cardHTML += `<div class="quick-links">`;
                if (job.company_overview) cardHTML += `<a href="#company-${job.id}" class="quick-link">🏢 Company</a>`;
                if (job.why_this_role) cardHTML += `<a href="#role-${job.id}" class="quick-link">💼 Role</a>`;
                if (tier === 1 && job.interview_prep) cardHTML += `<a href="#interview-${job.id}" class="quick-link">🎯 Interview</a>`;
                if (tier === 1 && job.talking_points) cardHTML += `<a href="#salary-${job.id}" class="quick-link">💵 Salary</a>`;
                if (tier === 1 && job.red_flags) cardHTML += `<a href="#flags-${job.id}" class="quick-link">⚠️ Red Flags</a>`;
                cardHTML += `</div>`;
            }

            // Action buttons
            cardHTML += `<div class="actions">`;

            if (tier <= 2) {
                cardHTML += `<button class="btn btn-secondary" onclick="toggleDetails(${job.id})">View Details</button>`;
            }

            if (job.url) {
                cardHTML += `<button class="btn btn-secondary" onclick="window.open('${job.url}', '_blank')">View Listing</button>`;
            }

            cardHTML += `<button class="btn btn-success" onclick="applyToJob(${job.id})">APPLY NOW!</button>`;

            if (tier <= 2) {
                cardHTML += `<button class="btn btn-primary" onclick="trackJob(${job.id})">Track Match</button>`;
            }

            cardHTML += `</div>`;

            // Expandable sections (only Tier 1 & 2)
            if (tier <= 2) {
                cardHTML += `<div class="expandable hidden" id="details-${job.id}">`;

                if (job.company_overview) {
                    cardHTML += `
                        <div class="expand-section" id="company-${job.id}">
                            <div class="section-title">🏢 Company Overview</div>
                            <div class="section-content">${job.company_overview}</div>
                        </div>
                    `;
                }

                if (job.why_this_role) {
                    cardHTML += `
                        <div class="expand-section" id="role-${job.id}">
                            <div class="section-title">💼 Why This Role</div>
                            <div class="section-content">${job.why_this_role.replace(/\n/g, '<br>')}</div>
                        </div>
                    `;
                }

                if (tier === 1 && job.interview_prep) {
                    cardHTML += `
                        <div class="expand-section" id="interview-${job.id}">
                            <div class="section-title">🎯 Interview Preparation</div>
                            <div class="section-content">${job.interview_prep}</div>
                        </div>
                    `;
                }

                if (tier === 1 && job.talking_points) {
                    cardHTML += `
                        <div class="expand-section" id="salary-${job.id}">
                            <div class="section-title">💵 Salary Intelligence</div>
                            <div class="section-content">${job.talking_points.replace(/\n/g, '<br>')}</div>
                        </div>
                    `;
                }

                if (tier === 1 && job.red_flags) {
                    cardHTML += `
                        <div class="expand-section" id="flags-${job.id}">
                            <div class="section-title">⚠️ Red Flags</div>
                            <div class="section-content">${job.red_flags}</div>
                        </div>
                    `;
                }

                cardHTML += `</div>`;
            }

            card.innerHTML = cardHTML;
            return card;
        }

        function toggleDetails(jobId) {
            const details = document.getElementById(`details-${jobId}`);
            details.classList.toggle('hidden');
        }

        function applyToJob(jobId) {
            const job = jobs.find(j => j.id === jobId);
            if (job && job.url) {
                window.open(job.url, '_blank');
            } else {
                alert('Application link not available');
            }
        }

        function trackJob(jobId) {
            alert(`Tracking job #${jobId} - Feature coming soon!`);
        }

        function updateCounts() {
            const all = jobs.filter(filterByDate).length;
            const high = jobs.filter(j => filterByDate(j) && parseInt(j.match_score) >= 90).length;
            const corporate = jobs.filter(j => filterByDate(j) && j.job_type === 'Corporate').length;
            const nonprofit = jobs.filter(j => filterByDate(j) && j.job_type === 'Nonprofit').length;
            const tier1 = jobs.filter(j => filterByDate(j) && j.tier === 1).length;
            const tier2 = jobs.filter(j => filterByDate(j) && j.tier === 2).length;
            const tier3 = jobs.filter(j => filterByDate(j) && j.tier === 3).length;

            document.getElementById('count-all').textContent = all;
            document.getElementById('count-high').textContent = high;
            document.getElementById('count-corporate').textContent = corporate;
            document.getElementById('count-nonprofit').textContent = nonprofit;
            document.getElementById('count-tier1').textContent = tier1;
            document.getElementById('count-tier2').textContent = tier2;
            document.getElementById('count-tier3').textContent = tier3;
        }

        // Event listeners
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                currentFilter = this.dataset.filter;
                renderJobs();
            });
        });

        document.getElementById('dateFilter').addEventListener('change', function() {
            currentDateFilter = this.value;
            renderJobs();
        });

        document.getElementById('searchInput').addEventListener('input', renderJobs);

        // Initial render
        renderJobs();
    </script>
</body>
</html>
