<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Application Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        .kanban-col { min-height: 70vh; transition: background-color 0.2s; }
        .kanban-col.drag-over { background-color: #e0e7ff; }
        .card { cursor: grab; transition: all 0.2s; }
        .card:active { cursor: grabbing; transform: rotate(1deg); }
        .ghost { opacity: 0.4; background: #cbd5e1; border: 2px dashed #94a3b8; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="text-gray-800 h-screen flex flex-col overflow-hidden">

    <!-- Header -->
    <nav class="bg-white border-b border-gray-200 px-6 py-3 flex justify-between items-center shrink-0 z-10">
        <div class="flex items-center gap-4">
            <a href="/" class="text-gray-500 hover:text-gray-900 transition font-medium text-sm flex items-center gap-1">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                Dashboard
            </a>
            <h1 class="text-xl font-bold text-indigo-900">Application Tracker</h1>
        </div>
        <div id="sync-status" class="text-xs font-semibold text-gray-400 uppercase tracking-wider">
            Ready
        </div>
    </nav>

    <!-- Board -->
    <div class="flex-1 overflow-x-auto overflow-y-hidden p-6">
        <div class="flex gap-5 h-full min-w-[1400px]">

            <!-- Columns -->
            <div class="flex flex-col w-80 shrink-0">
                <div class="flex justify-between items-center mb-3 px-1">
                    <h2 class="font-bold text-gray-600 uppercase text-xs tracking-wide">New / To Review</h2>
                    <span id="count-New" class="bg-gray-200 text-gray-600 text-xs font-bold px-2 py-0.5 rounded-full">0</span>
                </div>
                <div id="col-New" data-status="New" class="kanban-col bg-gray-100 rounded-xl p-2 flex-1 overflow-y-auto no-scrollbar ring-1 ring-gray-200"></div>
            </div>

            <div class="flex flex-col w-80 shrink-0">
                <div class="flex justify-between items-center mb-3 px-1">
                    <h2 class="font-bold text-blue-600 uppercase text-xs tracking-wide">Applied</h2>
                    <span id="count-Applied" class="bg-blue-100 text-blue-600 text-xs font-bold px-2 py-0.5 rounded-full">0</span>
                </div>
                <div id="col-Applied" data-status="Applied" class="kanban-col bg-blue-50/50 rounded-xl p-2 flex-1 overflow-y-auto no-scrollbar ring-1 ring-blue-100"></div>
            </div>

            <div class="flex flex-col w-80 shrink-0">
                <div class="flex justify-between items-center mb-3 px-1">
                    <h2 class="font-bold text-purple-600 uppercase text-xs tracking-wide">Interview</h2>
                    <span id="count-Interview" class="bg-purple-100 text-purple-600 text-xs font-bold px-2 py-0.5 rounded-full">0</span>
                </div>
                <div id="col-Interview" data-status="Interview" class="kanban-col bg-purple-50/50 rounded-xl p-2 flex-1 overflow-y-auto no-scrollbar ring-1 ring-purple-100"></div>
            </div>

            <div class="flex flex-col w-80 shrink-0">
                <div class="flex justify-between items-center mb-3 px-1">
                    <h2 class="font-bold text-green-600 uppercase text-xs tracking-wide">Offer</h2>
                    <span id="count-Offer" class="bg-green-100 text-green-600 text-xs font-bold px-2 py-0.5 rounded-full">0</span>
                </div>
                <div id="col-Offer" data-status="Offer" class="kanban-col bg-green-50/50 rounded-xl p-2 flex-1 overflow-y-auto no-scrollbar ring-1 ring-green-100"></div>
            </div>

            <div class="flex flex-col w-80 shrink-0">
                <div class="flex justify-between items-center mb-3 px-1">
                    <h2 class="font-bold text-red-600 uppercase text-xs tracking-wide">Rejected</h2>
                    <span id="count-Rejected" class="bg-red-100 text-red-600 text-xs font-bold px-2 py-0.5 rounded-full">0</span>
                </div>
                <div id="col-Rejected" data-status="Rejected" class="kanban-col bg-red-50/50 rounded-xl p-2 flex-1 overflow-y-auto no-scrollbar ring-1 ring-red-100"></div>
            </div>

        </div>
    </div>

    <!-- JavaScript Logic -->
    <script>
        // --- PROD-READY CONFIGURATION ---
        // Using relative paths works on both Localhost and Render automatically
        const API_BASE = '/api';

        const STATUS_MAP = ['New', 'Applied', 'Interview', 'Offer', 'Rejected'];
        const UI_COLS = {};
        STATUS_MAP.forEach(s => UI_COLS[s] = document.getElementById(`col-${s}`));

        // --- Initialization ---
        async function init() {
            showSync('Loading...');
            try {
                const res = await fetch(`${API_BASE}/jobs`);
                if (!res.ok) throw new Error(`API Error: ${res.status}`);
                const jobs = await res.json();
                renderBoard(jobs);
                showSync('Synced');
            } catch (err) {
                console.error(err);
                showSync('Error', true);
                alert(`Failed to load jobs. Ensure server is running.`);
            }
        }

        // --- Rendering ---
        function renderBoard(jobs) {
            Object.values(UI_COLS).forEach(col => col.innerHTML = '');

            jobs.forEach(job => {
                let status = job.status || 'New';
                if (!UI_COLS[status]) status = 'New';
                const card = createCard(job);
                UI_COLS[status].appendChild(card);
            });

            updateCounts();
            initDragAndDrop();
        }

        function createCard(job) {
            const div = document.createElement('div');
            div.className = "card bg-white p-4 rounded-lg shadow-sm border border-gray-200 mb-3 hover:shadow-md group";
            div.setAttribute('data-id', job.id);

            let tierBadge = '';
            if(job.tier === 1) tierBadge = '<span class="bg-indigo-100 text-indigo-700 text-[10px] font-bold px-1.5 py-0.5 rounded">TIER 1</span>';
            if(job.tier === 2) tierBadge = '<span class="bg-blue-100 text-blue-700 text-[10px] font-bold px-1.5 py-0.5 rounded">TIER 2</span>';

            div.innerHTML = `
                <div class="flex justify-between items-start mb-1">
                    ${tierBadge}
                    <span class="text-xs font-bold text-emerald-600 bg-green-50 px-1.5 py-0.5 rounded">${job.match_score}%</span>
                </div>
                <h3 class="font-bold text-gray-900 text-sm leading-tight mb-0.5">${job.title}</h3>
                <p class="text-xs text-gray-500 mb-3">${job.company}</p>

                <div class="flex items-center justify-between border-t border-gray-100 pt-2 mt-2 opacity-0 group-hover:opacity-100 transition-opacity">
                    <a href="${job.url}" target="_blank" class="text-xs text-gray-400 hover:text-indigo-600 flex items-center gap-1">Link ↗</a>
                    <a href="${job.application_url || '#'}" target="_blank" class="text-xs text-indigo-600 font-semibold hover:underline">Apply</a>
                </div>
            `;
            return div;
        }

        function updateCounts() {
            STATUS_MAP.forEach(status => {
                const count = UI_COLS[status].children.length;
                document.getElementById(`count-${status}`).innerText = count;
            });
        }

        // --- Interaction ---
        function initDragAndDrop() {
            STATUS_MAP.forEach(status => {
                new Sortable(UI_COLS[status], {
                    group: 'kanban',
                    animation: 150,
                    ghostClass: 'ghost',
                    delay: 100, delayOnTouchOnly: true,
                    onEnd: async function (evt) {
                        const itemEl = evt.item;
                        const newStatus = evt.to.getAttribute('data-status');
                        const oldStatus = evt.from.getAttribute('data-status');
                        const jobId = itemEl.getAttribute('data-id');

                        if (newStatus === oldStatus) return;
                        updateCounts();
                        await updateStatus(jobId, newStatus);
                    }
                });
            });
        }

        async function updateStatus(id, status) {
            showSync('Saving...');
            try {
                const res = await fetch(`${API_BASE}/update_status`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id: id, status: status })
                });
                const data = await res.json();
                if(data.success) {
                    showSync('Saved');
                    setTimeout(() => showSync('Ready'), 2000);
                } else {
                    throw new Error(data.error || 'Unknown error');
                }
            } catch (err) {
                console.error("Sync Failed", err);
                showSync('Sync Failed!', true);
                alert("Failed to save status. Check network.");
            }
        }

        function showSync(msg, isError = false) {
            const el = document.getElementById('sync-status');
            el.innerText = msg;
            el.className = `text-xs font-semibold uppercase tracking-wider ${isError ? 'text-red-600' : 'text-gray-400'}`;
        }

        init();
    </script>
</body>
</html>
